name: update-nodes

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'node_finder/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: update-nodes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIHOMO_VERSION: v1.19.33
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install mihomo
        run: |
          set -e
          NAME="mihomo-linux-amd64-compatible-${MIHOMO_VERSION}"
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/${NAME}.gz"
          for i in 1 2 3; do
            curl -fsSL --retry 3 --retry-delay 3 -o "${NAME}.gz" "${URL}" && break
            sleep 5
          done
          gunzip -f "${NAME}.gz"
          mv "${NAME}" mihomo
          chmod +x mihomo
          ./mihomo -v

      - name: Build subscriptions
        run: python node_finder/main.py --mihomo ./mihomo --max-test 1500 --top 150 --concurrency 60 --speed-concurrency 8 --min-speed 300

      - name: Commit output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add output/clash.yaml output/base64.txt output/nodes.json
          if git diff --cached --quiet; then
            echo 'no changes'
          else
            git commit -m "chore: update subscriptions $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
